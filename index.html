<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Virtual Radio Room</title>
    <style>
        html,body{height:100%;margin:0;background:#000;overflow:hidden}
        #container{width:100%;height:100%}
        /* hidden file input - triggered by radio button clicks */
        #fileInput{display:none}
        canvas{display:block}
    </style>
</head>
<body>
    <div id="container"></div>

    <!-- Hidden file input: used to upload an audio file and assign it to a radio button -->
    <input id="fileInput" type="file" accept="audio/*" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
